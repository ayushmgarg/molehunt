[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molehunt"
version = "0.1.0"
description = "Synthetic forensic document attribution and training bench"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12,<1",
    "PySide6-Essentials>=6.7,<7",
    "python-docx>=1.1,<2",
    "lxml>=5,<7",
    "Pillow>=10,<13",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "matplotlib>=3.8,<4",
    "PyYAML>=6,<7",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
collusion = ["reedsolo>=1.7,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
molehunt = "molehunt.cli:main"

[tool.setuptools.packages.find]
include = ["molehunt*"]

[tool.setuptools.package-data]
"molehunt.game.cases" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
